name: Release (macOS bundle)

# Builds the OpenStreamHub.app bundle and, when both architectures build, makes
# a DRAFT GitHub release from them (zip and DMG per architecture, SHA256SUMS.txt,
# docs/release-notes-<version>.md as the body). It never publishes: that stays a
# manual step. Signing and notarization run only when the Apple secrets are
# configured; otherwise the artifacts are named "...-UNSIGNED" (ad-hoc signed).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks before the 15-minute macOS builds: the three version files
  # match the tag, the release notes exist and the release process doc names
  # the same version (scripts/check-release.sh).
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-release.sh "$GITHUB_REF_NAME"

  bundle:
    name: bundle (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Per-arch native builds, not universal: scripts/prepare-sidecar.mjs builds
    # one sidecar for one triple (masterhub-service-<triple>) and Tauri's
    # externalBin for universal-apple-darwin would need a lipo'd
    # masterhub-service-universal-apple-darwin, which the script does not
    # produce. Native runners keep the host triple correct without cross flags.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/open-stream-hub/src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/open-stream-hub/package-lock.json

      - name: npm ci
        working-directory: apps/open-stream-hub
        run: npm ci

      # Secrets cannot be tested in `if:` directly. Export them to the job
      # environment only when ALL required ones are present, so Tauri never
      # sees empty values and signs nothing by accident.
      - name: Detect signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] \
            && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            {
              echo "APPLE_CERTIFICATE<<EOF_CERT"
              echo "$APPLE_CERTIFICATE"
              echo "EOF_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Apple credentials found: bundle will be signed and notarized."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc identity: without it Tauri leaves the app unsigned (Intel)
            # or only linker-signed (arm64), and macOS refuses or rejects it.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::Apple signing secrets missing; producing an UNSIGNED (ad-hoc signed), un-notarized bundle."
          fi

      # beforeBuildCommand runs `npm run sidecar:release`, then `npm run build`.
      # Tauri signs the app and, per its bundler, the externalBin sidecar, when
      # APPLE_SIGNING_IDENTITY / APPLE_CERTIFICATE are set, and notarizes when
      # APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID are set.
      - name: Build Tauri bundle
        working-directory: apps/open-stream-hub
        # Creating the DMG mounts a disk image and is occasionally flaky on
        # hosted runners (it failed once on the Intel runner with no detail).
        # Retry, cleaning up a half-made image in between; the compiled app is
        # cached by then, so a retry takes seconds.
        run: |
          for attempt in 1 2 3; do
            if npx tauri build --bundles app,dmg; then exit 0; fi
            echo "::warning::tauri build failed (attempt $attempt of 3)"
            hdiutil info || true
            for volume in /Volumes/OpenStreamHub*; do
              [ -d "$volume" ] && hdiutil detach "$volume" -force || true
            done
            rm -f src-tauri/target/release/bundle/macos/rw.*.dmg
            sleep 10
          done
          exit 1

      # Fail the signed path if the sidecar or app is not validly signed.
      - name: Verify signatures
        if: steps.signing.outputs.signed == 'true'
        working-directory: apps/open-stream-hub/src-tauri/target/release/bundle/macos
        run: |
          codesign --verify --strict --verbose=2 OpenStreamHub.app/Contents/MacOS/masterhub-service
          codesign --verify --deep --strict --verbose=2 OpenStreamHub.app
          spctl --assess --type execute --verbose=4 OpenStreamHub.app
          xcrun stapler validate OpenStreamHub.app || true
          codesign --verify --strict --verbose=2 ../dmg/*.dmg

      # The unsigned path must still be ad-hoc signed and internally
      # consistent (0.3.0 shipped CI builds that were not).
      - name: Verify ad-hoc signature
        if: steps.signing.outputs.signed != 'true'
        working-directory: apps/open-stream-hub/src-tauri/target/release/bundle/macos
        run: |
          codesign --verify --strict --verbose=2 OpenStreamHub.app/Contents/MacOS/masterhub-service
          codesign --verify --deep --strict --verbose=2 OpenStreamHub.app
          codesign -dv OpenStreamHub.app 2>&1 | grep -q 'Signature=adhoc'

      - name: Archive bundle
        id: archive
        working-directory: apps/open-stream-hub/src-tauri/target/release/bundle/macos
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            name="OpenStreamHub-${{ matrix.arch }}-signed"
          else
            name="OpenStreamHub-${{ matrix.arch }}-UNSIGNED"
          fi
          ditto -c -k --keepParent OpenStreamHub.app "$RUNNER_TEMP/$name.zip"
          dmg=$(ls ../dmg/*.dmg | head -n 1)
          cp "$dmg" "$RUNNER_TEMP/$name.dmg"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "path<<EOF_PATHS"
            echo "$RUNNER_TEMP/$name.zip"
            echo "$RUNNER_TEMP/$name.dmg"
            echo "EOF_PATHS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  # Needs contents: write, so it is a separate job: the build jobs keep a
  # read-only token. Creates a draft only; an existing release is left alone.
  draft-release:
    name: draft release
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: OpenStreamHub-*
          path: artifacts

      - name: Draft the release
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          version="${version%%-*}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag already exists; leaving it alone."
            exit 0
          fi
          mkdir release
          # OpenStreamHub-<arch>-UNSIGNED.zip -> OpenStreamHub-<version>-<arch>-UNSIGNED.zip
          for f in artifacts/*/*.zip artifacts/*/*.dmg; do
            cp "$f" "release/$(basename "$f" | sed "s/^OpenStreamHub-/OpenStreamHub-$version-/")"
          done
          (cd release && sha256sum -- *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          [ "$(ls release/*.dmg release/*.zip | wc -l)" -eq 4 ] || { echo "::error::expected 4 files (zip and dmg per architecture)"; exit 1; }
          flags=""
          case "$tag" in *-*) flags="--prerelease" ;; esac
          gh release create "$tag" release/* --draft $flags \
            --title "OpenStreamHub $version" \
            --notes-file "docs/release-notes-$version.md" \
            --verify-tag
