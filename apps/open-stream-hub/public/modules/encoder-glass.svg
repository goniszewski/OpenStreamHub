<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254">
  <!-- Glass over the encoder's round screen: sheen, edge shading and a highlight arc. Everything else is transparent. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="52%"><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></radialGradient>
  </defs>
  <g transform="translate(627 627)">
    <circle r="250" fill="url(#sheen)"/>
    <circle r="250" fill="url(#vignette)"/>
    <circle r="249" fill="none" stroke="#050506" stroke-width="3"/>
    <path d="M-170 -150 A225 225 0 0 1 150 -170" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
