[package]
name = "open-stream-hub-app"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "OpenStreamHub desktop profiles and device-free simulation."

[workspace]

[lib]
name = "open_stream_hub_app"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
cooltek-sdk-service = { path = "../../../crates/cooltek-sdk-service" }
cooltek-sdk-masterhub = { path = "../../../crates/cooltek-sdk-masterhub" }
cooltek-sdk-cli = { path = "../../../crates/cooltek-sdk-cli" }
hidapi = { version = "2", features = ["macos-shared-device"] }
# Official `.mhz` profile import (src/mhz). Already locked (flate2 and
# crc32fast through png/image, sha2 through tauri-codegen): raw deflate,
# entry CRC-32 and the provenance hash for a hand-written in-memory ZIP
# reader, so no ZIP crate and no new package is added.
flate2 = "1.1"
crc32fast = "1.5"
sha2 = "0.10"
# NFKC folding for serial checks (src/mhz/mapping.rs); already locked
# through url/idna, so no new package.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sleep/wake observers (src/power.rs), the frontmost-app watcher
# (src/focus.rs) and application icons for key artwork (src/app_icon.rs).
# Already locked as Tauri dependencies; only features of those
# crates are added.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
security-framework = "3"

[dev-dependencies]
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
