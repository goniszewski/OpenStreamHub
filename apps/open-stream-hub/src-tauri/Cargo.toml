[package]
name = "open-stream-hub-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "OpenStreamHub desktop profiles and device-free simulation."

[workspace]

[lib]
name = "open_stream_hub_app"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
cooltek-sdk-service = { path = "../../../crates/cooltek-sdk-service" }
cooltek-sdk-masterhub = { path = "../../../crates/cooltek-sdk-masterhub" }
cooltek-sdk-cli = { path = "../../../crates/cooltek-sdk-cli" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
