[package]
name = "cooltek-sdk-cli"
version = "0.1.0"
edition = "2024"
default-run = "masterhub-diag"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "MasterHUB device inventory, bounded raw recording, and offline replay."

[[bin]]
name = "masterhub-diag"
path = "src/main.rs"

[[bin]]
name = "masterhub-service"
path = "src/bin/masterhub-service.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cooltek-sdk-masterhub = { path = "../cooltek-sdk-masterhub" }
cooltek-sdk-service = { path = "../cooltek-sdk-service" }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gif = "=0.14.2"
