[package]
name = "cooltek-sdk-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "MasterHUB profiles, input bindings, and macOS action dispatch."

[dependencies]
cooltek-sdk-masterhub = { path = "../cooltek-sdk-masterhub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
